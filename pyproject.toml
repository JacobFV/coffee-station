[project]
name = "coffee-station"
version = "0.1.0"
description = "Gemini-controlled desktop harness for a USB Hugging Face LeRobot arm."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.15.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyserial>=3.5",
    "pywebview>=5.3",
    "scipy>=1.12.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
lerobot = [
    "lerobot[feetech]>=0.4.1",
]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
coffee-station = "coffee_station.__main__:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coffee_station = ["static/*", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
